<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap / Kayıt Ol - Marifetli Eller</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdfbfb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid #f0e6e6;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            transition: 0.3s;
        }

        .auth-tab.active {
            color: #d6336c;
            border-bottom: 2px solid #d6336c;
            margin-bottom: -2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: #d6336c;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
        }

        .auth-btn:hover {
            background-color: #b8265a;
        }

        /* Google Butonu Tasarımı */
        .google-btn {
            width: 100%;
            padding: 12px;
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background-color: #f5f5f5;
        }

        .google-btn img {
            width: 20px;
        }

        .ayrac {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
            position: relative;
        }

        .ayrac::before,
        .ayrac::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: #ddd;
        }

        .ayrac::before {
            left: 0;
        }

        .ayrac::after {
            right: 0;
        }

        #mesajKutusu {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }

        .gizli {
            display: none;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="index.html" style="text-decoration: none; color: #d6336c; font-weight: 600; font-size: 24px;">🌸
                Marifetli Eller</a>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" onclick="tabDegistir('giris')">Giriş Yap</div>
            <div class="auth-tab" onclick="tabDegistir('kayit')">Kayıt Ol</div>
        </div>

        <!-- GİRİŞ FORMU -->
        <div id="form-giris">
            <div class="form-group">
                <label>E-Posta Adresiniz</label>
                <input type="email" id="giris-email" placeholder="ornek@mail.com">
            </div>
            <div class="form-group">
                <label>Şifreniz</label>
                <input type="password" id="giris-sifre" placeholder="••••••••">
            </div>
            <button class="auth-btn" onclick="kullaniciGiris()">Giriş Yap</button>
        </div>

        <!-- KAYIT FORMU -->
        <div id="form-kayit" class="gizli">
            <div class="form-group">
                <label>E-Posta Adresiniz</label>
                <input type="email" id="kayit-email" placeholder="ornek@mail.com">
            </div>
            <div class="form-group">
                <label>Şifreniz (En az 6 karakter)</label>
                <input type="password" id="kayit-sifre" placeholder="••••••••">
            </div>
            <button class="auth-btn" onclick="kullaniciKayit()">Kayıt Ol</button>
        </div>

        <div class="ayrac">veya</div>

        <!-- GOOGLE İLE GİRİŞ BUTONU -->
        <button class="google-btn" onclick="googleIleGiris()">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.73 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Google ile Devam Et
        </button>

        <div id="mesajKutusu"></div>
    </div>

    <script>
        // FİREBASE BİLGİLERİNİZİ BURAYA YAPIŞTIRIN
        const firebaseConfig = {
            apiKey: "AIzaSyDxgpXtgQQKtFPKYppu7HByBVxyib6vS1k",
            authDomain: "marifetlieller-42.firebaseapp.com",
            projectId: "marifetlieller-42",
            storageBucket: "marifetlieller-42.firebasestorage.app",
            messagingSenderId: "632366040975",
            appId: "1:632366040975:web:15e8a77207e3c3ac326dfa",
            measurementId: "G-TJ1BEFV7W9"
        };

        // Firebase'i Başlat
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Sayfa Yüklendiğinde Son Girilen Maili Hatırla
    document.addEventListener("DOMContentLoaded", function() {
        const sonMail = localStorage.getItem("hatirlananMail");
        if(sonMail) {
            document.getElementById('giris-email').value = sonMail;
        }
    });

    // Tab Değiştirme Animasyonu
    function tabDegistir(hedef) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('form-giris').classList.add('gizli');
        document.getElementById('form-kayit').classList.add('gizli');

        if (hedef === 'giris') {
            document.querySelectorAll('.auth-tab')[0].classList.add('active');
            document.getElementById('form-giris').classList.remove('gizli');
        } else {
            document.querySelectorAll('.auth-tab')[1].classList.add('active');
            document.getElementById('form-kayit').classList.remove('gizli');
        }
        document.getElementById('mesajKutusu').innerText = "";
    }

    // Şifre Zorluk Kontrolü (Kayıt İşlemi)
    function kullaniciKayit() {
        const email = document.getElementById('kayit-email').value;
        const sifre = document.getElementById('kayit-sifre').value;
        const mesaj = document.getElementById('mesajKutusu');

        // Regex: En az 8 karakter, 1 küçük, 1 büyük, 1 sembol
        const sifreKurali = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}$/;
        
        if (!sifreKurali.test(sifre)) {
            mesaj.style.color = "red";
            mesaj.innerText = "Şifreniz en az 8 karakterden oluşmalı; en az bir BÜYÜK harf, bir küçük harf ve bir sembol (!@#$ vb.) içermelidir.";
            return;
        }

        auth.createUserWithEmailAndPassword(email, sifre)
            .then((userCredential) => {
                mesaj.style.color = "green";
                mesaj.innerText = "Kayıt başarılı! Yönlendiriliyorsunuz...";
                localStorage.setItem("hatirlananMail", email); // Kayıt olunca da maili hatırla
                setTimeout(() => window.location.href = "index.html", 1500);
            })
            .catch((error) => {
                mesaj.style.color = "red";
                mesaj.innerText = "Hata: " + error.message;
            });
    }

    // Normal Giriş İşlemi
    function kullaniciGiris() {
        const email = document.getElementById('giris-email').value;
        const sifre = document.getElementById('giris-sifre').value;
        const mesaj = document.getElementById('mesajKutusu');

        auth.signInWithEmailAndPassword(email, sifre)
            .then((userCredential) => {
                mesaj.style.color = "green";
                mesaj.innerText = "Giriş yapıldı! Yönlendiriliyorsunuz...";
                
                // Başarılı girişte e-postayı tarayıcıya kaydet
                localStorage.setItem("hatirlananMail", email); 
                
                setTimeout(() => window.location.href = "index.html", 1500);
            })
            .catch((error) => {
                mesaj.style.color = "red";
                mesaj.innerText = "Hatalı e-posta veya şifre girdiniz.";
            });
    }

    // GOOGLE İLE GİRİŞ İŞLEMİ
    function googleIleGiris() {
        const provider = new firebase.auth.GoogleAuthProvider();
        const mesaj = document.getElementById('mesajKutusu');

        auth.signInWithPopup(provider)
            .then((result) => {
                mesaj.style.color = "green";
                mesaj.innerText = "Google ile giriş yapıldı! Yönlendiriliyorsunuz...";
                setTimeout(() => window.location.href = "index.html", 1500);
            }).catch((error) => {
                mesaj.style.color = "red";
                mesaj.innerText = "Google girişi iptal edildi veya bir hata oluştu. (Lütfen dosyayı GitHub'a yükleyerek test edin)";
            });
    }
    </script>
</body>

</html>
