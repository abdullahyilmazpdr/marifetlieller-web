<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://marifetliel.com/model-gonder.html">
    <title>Model Gönder - Marifetli Eller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css?v=20261116_2">

    <!-- Firebase SDK (Güvenlik kontrolü için şart) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" defer></script>
</head>
<body>

    {% include 'header_sablon.html' %}

    <main>
        <div class="model-gonder-sayfasi">
            <h2 style="text-align: center; color: var(--ana-renk);">El Emeğinizi Paylaşın, Yazarımız Olun!</h2>
            <p style="text-align: center; color: var(--metin-acik);">Yaptığınız harika iğne oyası, mekik ve örgü modellerini, yapılış hikayeleriyle birlikte topluluğumuzla paylaşın. Sitemizde sizin adınızla yayınlayalım.</p>
        </div>
    </main>

    {% include 'footer_sablon.html' %}

    <!-- GİRİŞ KONTROLÜ -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            firebase.auth().onAuthStateChanged((user) => {
                const kapsayici = document.querySelector('.model-gonder-sayfasi');
                
                if (!user) {
                    kapsayici.innerHTML = `
                        <div style="text-align:center; padding: 50px;">
                            <h2 style="color:red;">Lütfen Giriş Yapın!</h2>
                            <p>Kendi modellerinizi ve makalelerinizi gönderebilmek için topluluğumuza üye olmalısınız.</p>
                            <a href="giris.html" style="background: #d6336c; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; display: inline-block; margin-top: 15px;">Kayıt Ol / Giriş Yap</a>
                        </div>
                    `;
                } else {
                    // Firebase emaili onayladıktan sonra Iframe'i URL içine email gömerek yaratıyoruz!
                    const formsUrl = "https://script.google.com/macros/s/AKfycbxUwJTckSQ52vHT9GAKOFTOvyryxRyoeR32q7yIZt9MhPYBwO1VikmIosC-VzyqUd33/exec?email=" + encodeURIComponent(user.email);
                    
                    kapsayici.innerHTML = `
                        <h2 style="text-align: center; color: var(--ana-renk);">El Emeğinizi Paylaşın, Yazarımız Olun!</h2>
                        <p style="text-align: center; color: var(--metin-acik);">Yaptığınız harika modelleri hikayeleriyle birlikte topluluğumuzla paylaşın.</p>
                        <iframe src="${formsUrl}" width="100%" height="1000px" frameborder="0" scrolling="no" style="max-width: 650px; margin: 0 auto; display: block; border-radius: 12px;"></iframe>
                    `;
                }
            });
        });
    </script>
</body>
</html>
